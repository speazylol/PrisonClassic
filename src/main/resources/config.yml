    PRISMARINE_BRICKS: 43.5
    DARK_PRISMARINE: 51.2
    SEA_LANTERN: 120
    OBSIDIAN: 422             # мета «Бум+Бум» — фарм денег на обсидиане
    CRYING_OBSIDIAN: 500
    GLOWSTONE: 163
    HAY_BLOCK: 140
    PUMPKIN: 92.8

# ----- Зачарования (EnchantService / EnchantListener) -----
enchants:
  slots:
    armor: 3
    weapon: 2
    tool: 4
  max-book-chance: 80
  proc-chance: 0.12
  proc-factor: 8
  boom:                     # Бум I–III: сферический подрыв радиусом 1/2/3, дроп сразу в монеты, блоки в статистику
    chance1: 0.015
    chance2: 0.010
    chance3: 0.008
  totem:                    # Тотем бессмертия I–II (только из Древнего ключа, 1 книга на сет)
    cooldown-seconds-1: 300
    cooldown-seconds-2: 180

keys:
  perk-common-per-level: 0.0004
  keymaster-dk-1: 0.00002
  keymaster-dk-2: 0.00004
  keymaster-legendary: 0.0000125

exchange:
  common-per-dk: 64
  stars-per-dk: 14          # Древний ключ = 14 Звёзд (как у Донат-NPC)
  dk-per-legendary: 16
  dust-per-100: 15

milestones:
  m1: {blocks: 1000, coins: 20}
  m2: {blocks: 5000, coins: 100, key: common}
  m3: {blocks: 10000, coins: 250, key: common}
  m4: {blocks: 25000, coins: 600, key: common, keys: 2}
  m5: {blocks: 50000, coins: 1500, key: dk}
  m6: {blocks: 100000, coins: 3000, key: dk}
  m7: {blocks: 250000, coins: 8000, key: dk, keys: 2}
  m8: {blocks: 500000, coins: 15000, key: dk, keys: 3}
  m9: {blocks: 1000000, coins: 30000, key: dk, keys: 5}
  m10: {blocks: 5000000, coins: 150000, key: dk, keys: 10}

# ----- Тренер (TrainerService): навыки с тирами и требованиями + экономические перки -----
# req: block:<МАТЕРИАЛ> — вскопать блоков этого типа; mob:<id> — убить мобов; player_kills — убийства игроков; level — уровень.
# value — суммарное значение навыка на тире.
trainer:
  max-discount: 0.10
  curse:
    seconds: 4              # дебафф «Проклятие»: Иссушение I + Слабость I
  active:
    radius: 6
    cooldown: 60
  skills:
    agility:
      name: "Ловкость"
      material: FEATHER
      desc: "Скорость бега"
      tiers:
        - {cost: 300, value: 0.03, req: {"block:DIRT": 2000}}
        - {cost: 800, value: 0.06, req: {"block:STONE": 5000}}
        - {cost: 1800, value: 0.09, req: {"block:COBWEB": 1000, "mob:rat": 300}}
        - {cost: 4000, value: 0.12, req: {"block:EMERALD_BLOCK": 3000, "mob:zombie": 300}}
        - {cost: 9000, value: 0.15, req: {"block:PRISMARINE": 3000, player_kills: 100}}
    luck:
      name: "Удача"
      material: RABBIT_FOOT
      desc: "Шанс повышенного (x2) дропа редких руд"
      tiers:
        - {cost: 400, value: 0.01, req: {"block:COAL_ORE": 500}}
        - {cost: 900, value: 0.02, req: {"block:IRON_ORE": 800, "block:GOLD_ORE": 300}}
        - {cost: 1800, value: 0.03, req: {"block:DIAMOND_ORE": 300, "block:GOLD_BLOCK": 100}}
        - {cost: 3500, value: 0.045, req: {"block:LAPIS_ORE": 500, "block:EMERALD_BLOCK": 2000}}
        - {cost: 7000, value: 0.06, req: {"block:DIAMOND_BLOCK": 100, "block:OBSIDIAN": 500}}
    curse:
      name: "Проклятие"
      material: WITHER_ROSE
      desc: "+2% шанс наложить «Проклятие» при PVP-ударе за тир (до 12%)"
      tiers:
        - {cost: 500, value: 0.02, req: {"block:GOLD_BLOCK": 100, player_kills: 50, "mob:zombie": 100}}
        - {cost: 750, value: 0.04, req: {"block:GOLD_BLOCK": 250, "block:DIAMOND_BLOCK": 25, player_kills: 100, "mob:zombie": 200}}
        - {cost: 1000, value: 0.06, req: {"block:GOLD_BLOCK": 400, "block:DIAMOND_BLOCK": 50, player_kills: 250, "mob:zombie": 350}}
        - {cost: 1500, value: 0.08, req: {"block:GOLD_BLOCK": 600, "block:DIAMOND_BLOCK": 75, player_kills: 400, "mob:zombie": 500}}
        - {cost: 2200, value: 0.10, req: {"block:GOLD_BLOCK": 800, "block:DIAMOND_BLOCK": 100, player_kills: 700, "mob:zombie": 650, "mob:mini_slime": 250}}
        - {cost: 3000, value: 0.12, req: {"block:GOLD_BLOCK": 1000, "block:DIAMOND_BLOCK": 150, "block:OBSIDIAN": 100, player_kills: 1000, "mob:zombie": 750, "mob:mini_slime": 250}}
    mobdmg:
      name: "Урон по мобам"
      material: IRON_SWORD
      desc: "+1 единица чистого урона по PVE-сущностям за тир"
      tiers:
        - {cost: 500, value: 1, req: {"mob:rat": 100}}
        - {cost: 1125, value: 2, req: {"mob:rat": 250}}
        - {cost: 1750, value: 3, req: {"mob:rat": 450, "mob:zombie": 50}}
        - {cost: 2375, value: 4, req: {"mob:rat": 700, "mob:zombie": 150}}
        - {cost: 3000, value: 5, req: {"mob:rat": 950, "mob:zombie": 300}}
        - {cost: 3625, value: 6, req: {"mob:rat": 1200, "mob:zombie": 450}}
        - {cost: 4250, value: 7, req: {"mob:rat": 1500, "mob:zombie": 600}}
        - {cost: 4875, value: 8, req: {"mob:rat": 1750, "mob:zombie": 800, "mob:mini_slime": 250}}
        - {cost: 5500, value: 9, req: {"mob:rat": 2000, "mob:zombie": 1000, "mob:mini_slime": 250}}
    crit:
      name: "Критический удар"
      material: DIAMOND_SWORD
      desc: "+3% шанс крита по игроку за тир (до 15%)"
      tiers:
        - {cost: 1000, value: 0.03, req: {"block:OBSIDIAN": 50}}
        - {cost: 1800, value: 0.06, req: {"block:OBSIDIAN": 100, "block:PRISMARINE_BRICKS": 100}}
        - {cost: 2800, value: 0.09, req: {"block:OBSIDIAN": 150, "block:DARK_PRISMARINE": 150, "block:PRISMARINE_BRICKS": 150}}
        - {cost: 4000, value: 0.12, req: {"block:OBSIDIAN": 250, "block:DARK_PRISMARINE": 250, "block:PRISMARINE_BRICKS": 250}}
        - {cost: 5500, value: 0.15, req: {"block:OBSIDIAN": 400, "block:DARK_PRISMARINE": 400, "block:PRISMARINE_BRICKS": 400}}
  perks:
    discount: {name: "Скидки", material: GOLD_INGOT, max: 10, step: 0.01, base-cost: 2000, growth: 1.5, desc: "-1% на уровни, навыки и /up (макс. 10%)"}
    coin: {name: "Бустер монет", material: EMERALD, max: 20, step: 0.01, base-cost: 800, growth: 1.35, desc: "+1% к продаже за уровень"}
    blocks: {name: "Бустер блоков", material: DIAMOND_PICKAXE, max: 20, step: 0.01, base-cost: 800, growth: 1.35, desc: "+1% к счётчику блоков за уровень"}
    keydrop: {name: "Дроп ключей", material: TRIPWIRE_HOOK, max: 10, base-cost: 1200, growth: 1.5, desc: "Шанс обычного ключа за блок"}
    stars: {name: "Шанс звёзд", material: NETHER_STAR, max: 10, step: 0.01, min-level: 10, base-cost: 5000, growth: 1.45, desc: "+1% звёзд с боссов (макс. 10%)"}
    crit_damage: {name: "Урон крита", material: BLAZE_POWDER, max: 20, base-cost: 1000, growth: 1.4, desc: "Крит x1.5 +5% за уровень"}
    active: {name: "Активка", material: ENDER_EYE, max: 3, min-level: 30, base-cost: 100000, growth: 3.0, desc: "/active: крадёт по сердцу у всех вокруг"}

# ----- Донат: права prison.donate.1..5. AutoSell_Premium — также право AutoSell_Premium или покупка у Донат-NPC -----
donate:
  base-tp-seconds: 3.0
  site: "сайт сервера"     # где покупать (показывается в /donate)
  # Привилегии: право prison.donate.N (выдавайте через LuckPerms после оплаты). Старшая включает перки младших.
  #   sell — /sell в любой точке, autosell — /autosell, no-needs — без нужд, daily-keys/daily-dk — ежедневно в /donate
  1: {name: "VIP", color: "green", tp-seconds: 2.8, coin-boost: 0.2, daily-keys: 1}
  2: {name: "PREMIUM", color: "aqua", tp-seconds: 2.6, coin-boost: 0.4, sell: true, daily-keys: 2}
  3: {name: "ELITE", color: "light_purple", tp-seconds: 2.45, coin-boost: 0.6, sell: true, autosell: true, daily-keys: 3}
  4: {name: "LEGEND", color: "gold", tp-seconds: 2.33, coin-boost: 0.75, sell: true, autosell: true, no-needs: true, daily-keys: 5}
  5: {name: "EVO", color: "red", tp-seconds: 2.15, coin-boost: 1.0, block-boost: 0.2, trainer-discount: 0.05, sell: true, autosell: true, no-needs: true, daily-keys: 7, daily-dk: 1}

donate-npc:
  dk-stars: 14              # Древний ключ у Донат-NPC
  autosell-premium:
    stars: 120
    days: 30

contraband:
  chance: 0.004
  value: 20

# ----- Камеры (CellManager + CellService): с 8 уровня, 4 тира -----
cells:
  min-level: 8
  price: 250
  refund: 0.5
  upgrade-costs: [5000, 15000, 40000]   # 1->2, 2->3, 3->4
  tiers:
    sieve: 2
    shower: 3
    shelf: 4
  shower-luck-minutes: 10   # душ с мылом: бафф «Удача»
  shower-luck-bonus: 0.05   # +5% к шансу x2 редких руд

# ----- Фракции -----
factions:
  min-level: 5
  leave-cost: 500
  balance:                  # динамическая фракционная скидка (уровни, тренер, /up)
    enabled: true
    window-hours: 168       # окно среднего исторического онлайна (EMA), 7 суток
    factor: 0.5             # скидка = (средний онлайн всех − онлайн фракции) / средний × factor
    max-discount: 0.25
  points:                   # PointService: x2 блоков на Базе за 1 точку, x3 за 2, x4 за 3
    radius: 4
    capture-seconds: 60
    upgrade-discount-per-point: 0.03
    list:
      a: "Запад"
      b: "Восток"
      c: "Север"
  list:
    guards: {name: "Стража", color: "blue", sell-bonus: 1.00, boss-bonus: 1.15, damage-bonus: 1.10}
    thieves: {name: "Воры", color: "red", sell-bonus: 1.12, boss-bonus: 1.00, damage-bonus: 1.00}
    miners: {name: "Шахтёры", color: "gold", sell-bonus: 1.20, boss-bonus: 1.00, damage-bonus: 0.95}

mines:
  blocks-per-tick: 12000

build:
  auto: true
  world: prison_classic
  y: 64
  blocks-per-tick: 15000

