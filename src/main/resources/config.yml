block-natural-mobs: true   # мобы сами не спавнятся — только боссы и мобы плагина
# ===================== PrisonClassic 4.0 — режим «Prison Classic / Normal» по ТЗ =====================
# Модули: level, data, trainer, upgrade, enchant, awaken, treasure, boss, mine, cell, church, needs, family,
# six (тюремная банда), sell, shop, auction, crate, donate, dungeon, collection, game (ttt), merchant, basement, ui.

config-version: 4          # при старте со старым конфигом (без версии/версия < 4) он сохраняется в config-old.yml и заменяется новым
autosave-minutes: 5
keep-inventory: true
no-hunger: false

# ----- Хранилище PlayerData (DataManager). type: yaml | mysql -----
# В MySQL пишутся UUID, ник, уровень, монеты, звёзды, блоки, убийства, фракция, банда + полный снимок (потиповые блоки,
# сытость, нужды, квесты, ветки коллекций, баффы). Драйвер MySQL входит в Paper.
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: prison
    user: root
    password: ""
    ssl: false
    table-prefix: "prison_"

spawn:
  protect-radius: 30

combat:
  evasion: 0.17
  protect-blocks: true

# ----- Уровни 1–40 (LevelManager): нужны И блоки (всего добыто), И монеты -----
levels:
  max: 40
  table:
    - {blocks: 2100, money: 15}        # 1 -> 2
    - {blocks: 4000, money: 25}        # 2 -> 3
    - {blocks: 7500, money: 25}        # 3 -> 4
    - {blocks: 15000, money: 130}      # 4 -> 5
    - {blocks: 22000, money: 350}      # 5 -> 6
    - {blocks: 30000, money: 775}      # 6 -> 7
    - {blocks: 41000, money: 850}      # 7 -> 8
    - {blocks: 115000, money: 1600}    # 8 -> 9   (ТЗ: 115 000 блоков)
    - {blocks: 185000, money: 3200}    # 9 -> 10  (ТЗ)
    - {blocks: 260000, money: 6200}    # 10 -> 11 (ТЗ)
    - {blocks: 380000, money: 12500}   # 11 -> 12 (ТЗ)
    - {blocks: 575000, money: 25000}   # 12 -> 13 (ТЗ)
    - {blocks: 810000, money: 50000}   # 13 -> 14 (ТЗ)
    - {blocks: 1400000, money: 87500}  # 14 -> 15 (ТЗ)
    - {blocks: 1624000, money: 112000}   # 15 -> 16  (далее: блоки x1.16, монеты x1.28 за уровень)
    - {blocks: 1884000, money: 143500}   # 16 -> 17
    - {blocks: 2185000, money: 183500}   # 17 -> 18
    - {blocks: 2535000, money: 235000}   # 18 -> 19
    - {blocks: 2941000, money: 301000}   # 19 -> 20
    - {blocks: 3412000, money: 385500}   # 20 -> 21
    - {blocks: 3958000, money: 493500}   # 21 -> 22
    - {blocks: 4591000, money: 631500}   # 22 -> 23
    - {blocks: 5326000, money: 808500}   # 23 -> 24
    - {blocks: 6178000, money: 1035000}  # 24 -> 25
    - {blocks: 7166000, money: 1325000}  # 25 -> 26
    - {blocks: 8313000, money: 1696000}  # 26 -> 27
    - {blocks: 9643000, money: 2171000}  # 27 -> 28
    - {blocks: 11186000, money: 2779000} # 28 -> 29
    - {blocks: 12976000, money: 3557000} # 29 -> 30
    - {blocks: 15052000, money: 4553000} # 30 -> 31
    - {blocks: 17460000, money: 5828000} # 31 -> 32
    - {blocks: 20254000, money: 7460000} # 32 -> 33
    - {blocks: 23495000, money: 9549000} # 33 -> 34
    - {blocks: 27254000, money: 12222500} # 34 -> 35
    - {blocks: 31615000, money: 15645000} # 35 -> 36
    - {blocks: 36673000, money: 20025500} # 36 -> 37
    - {blocks: 42541000, money: 25632500} # 37 -> 38
    - {blocks: 49348000, money: 32809500} # 38 -> 39
    - {blocks: 57244000, money: 41996000} # 39 -> 40
  hp-per-level: 2.0          # +2 HP (+1 сердце) за каждый уровень
  damage-every: 5            # +1 к базовому урону каждые 5 уровней...
  damage-per-step: 1.0
  damage-cap-level: 20       # ...вплоть до финального бонуса на 20 уровне (+4)
  damage-per-level: 0.0      # старый мультипликатор урона отключён

pickaxe:
  enabled: false
  material: DIAMOND_PICKAXE
  efficiency-base: 2
  levels-per-efficiency: 8
  efficiency-max: 6

# ----- Продажа (SellService). /sell — только с флагом AutoSell_Premium; остальные — торговцы шахт -----
# Цена блока по умолчанию: (1.27^(ур.шахты−1) / 64) × множитель блока; руда без «Шёлка» — 60% от цены руды.
