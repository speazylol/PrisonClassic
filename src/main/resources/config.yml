# ----- Аукцион (AuctionService): /auc sell <цена>; снять свой лот — штраф 10% цены -----
auction:
  max-lots: 12
  lot-hours: 48
  remove-fee: 0.10
  tax: 0.05

private-mine:
  donate-minutes-per-day:   # личная шахта по привилегиям (минут в день)
    3: 20
    4: 40
    5: 60

gangs:
  min-level: 5
  create-cost: 2500
  levels:
    1: {members: 5, sell-bonus: 0.00, block-bonus: 0.00}
    2: {cost: 20000, members: 6, sell-bonus: 0.02, block-bonus: 0.02}
    3: {cost: 80000, members: 7, sell-bonus: 0.04, block-bonus: 0.04}
    4: {cost: 250000, members: 8, sell-bonus: 0.06, block-bonus: 0.06}
    5: {cost: 700000, members: 10, sell-bonus: 0.08, block-bonus: 0.08}

# ----- Семьи: брак (/family) -----
families:
  min-level: 5
  wedding-cost: 500
  divorce-cost: 1500
  sell-bonus: 0.03
  regen-radius: 15
  tp-cooldown-seconds: 300

# ----- Войны Семей за контрольные точки (/fw). Семья = клан (/gang) -----
family-war:
  assault-seconds: 300
  capture-seconds: 90
  capture-radius: 6
  start-radius: 10
  cooldown-seconds: 1800     # КД точки после штурма (не ставится, если проиграла нейтральная Семья)
  income-per-hour: 2000      # доход владельцу в казну Семьи
  points:
    west: "Западный форт"
    east: "Восточный форт"
    south: "Южная мельница"

# ----- Тюремная банда (/six): NPC-помощники в камере, едят арбузы, приносят щебень и монеты (и офлайн) -----
sixes:
  max: 4
  buy-cost: [300, 900, 2500, 6000]
  max-level: 3
  upgrade-cost: [0, 1500, 5000]
  gravel-per-hour-per-level: 8
  coins-per-hour-per-level: 15
  food-per-hour-per-level: 1.0
  max-storage: 2048
  gravel-price: 0.5
  food: {MELON: 4, MELON_SLICE: 1, BREAD: 1, APPLE: 1, COOKED_BEEF: 2, COOKED_PORKCHOP: 2, COOKED_CHICKEN: 1.5, BAKED_POTATO: 1, ROTTEN_FLESH: 0.5}

# ----- Сито (камера 2+ ур.): щебень, гравий, песок → драгоценные камни и реагенты -----
sieve:
  substance-price: 15
  loot:
    - {type: nothing, weight: 40}
    - {type: dust, weight: 28}
    - {type: substance, weight: 18}
    - {type: gem, weight: 9}
    - {type: key, weight: 3}
    - {type: stars, weight: 2}

# ----- Коллекции «Наследие Предков» (30 осколков) -----
collections:
  chance-any-block: 0.000166   # ~1/6000 — осколок «любой блок шахты»
  chance-block: 0.000666       # ~1/1500 — осколок с конкретного блока
  chance-mob: 0.0066           # ~1/150 — осколок с моба

# ----- Подземелье «Вампирские катакомбы» -----
dungeon:
  min-level: 17
  party-size: 3
  pass-mine: "17"              # Стройка
  pass-chance: 0.00025         # шанс пропуска за блок на Стройке
  time-limit-minutes: 15
  boss-health: 600
  first-clear-exp: 20000       # опыт (очки прогресса уровня) каждому за первое закрытие
  repeat-coins: 1500

# ----- Тюремный подвал -----
basement:
  min-level: 6
  session-minutes: 30          # сколько даёт один «Пропуск в подвал»

# ----- Крестики-нолики (/ttt) -----
ttt:
  min-bet: 10
  fee: 0.0
  turn-seconds: 30

# ----- Деревня Люфония: заточка и пробуждение -----
