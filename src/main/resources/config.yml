  first-minute-buff-minutes: 20   # первая минута службы — 20 минут баффа
  per-minute-buff-minutes: 5      # каждая следующая минута — ещё +5
  max-buff-minutes: 40            # максимум 40 минут активной игры (Старовер — x2)
  sell-bonus: 0.25                # множитель продаваемых ресурсов на время баффа

