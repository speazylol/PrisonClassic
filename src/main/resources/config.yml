  level-bonus: 0.01
  prices:
    ROTTEN_FLESH: 0.3
    MAGMA_CREAM: 1
    COD: 0.8
    SALMON: 1.2
    RABBIT_HIDE: 0.5
  stack-prices:
    DIRT: 0.8
    SAND: 0.9
    GRAVEL: 0.9
