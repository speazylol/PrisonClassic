# ----- Нужды (NeedsService): туалет → Медлительность, грязь → Тошнота, усталость → Утомление; 100 → Слабость -----
needs:
  enabled: true
  threshold: 70
  toilet-per-minute: 1.4
  shower-per-minute: 0.9
  sleep-per-minute: 0.7
  without-item: 50          # душ без мыла снимает только 50
  no-paper-dirt: 40         # туалет без бумаги: +40 грязи и «грязный» статус до душа
  toilet-blocks: [HOPPER]
  shower-blocks: [WATER_CAULDRON]

